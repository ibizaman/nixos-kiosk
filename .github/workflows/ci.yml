name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    uses: nixbuild/nixbuild-action/.github/workflows/ci-workflow.yml@v27
    with:
      filter_builds: '.top_attr == "checks" and .system == "x86_64-linux"'
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

  build-images:
    uses: nixbuild/nixbuild-action/.github/workflows/ci-workflow.yml@v27
    with:
      filter_builds: '.top_attr == "packages" and (.attr | startswith("sdimage"))'
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

  upload-images:
    name: Upload SD Image (${{ matrix.config }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [checks, build-images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixos-kiosk-rpi3
            package: packages.aarch64-linux.sdimage-rpi3
          - config: nixos-kiosk-rpi2
            package: packages.armv7l-linux.sdimage-rpi2
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-substituters = https://nixos-kiosk.cachix.org https://ibizaman.cachix.org https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = ibizaman.cachix.org-1:Y8cRpAoeMfeeUp1jRG5KuwoVteZOQLG4HYkYyT4TC8k= nixos-kiosk.cachix.org-1:Ra804yD9XwVuzkKY3SnXbPz36sH5hHr27fz1qSBdmZ0= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Download SD image
        run: nix build .#${{ matrix.package }} -o result

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config }}
          path: result/*.img.zst
          if-no-files-found: error
