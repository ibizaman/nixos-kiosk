name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-substituters = https://nixos-kiosk.cachix.org https://ibizaman.cachix.org https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = ibizaman.cachix.org-1:Y8cRpAoeMfeeUp1jRG5KuwoVteZOQLG4HYkYyT4TC8k= nixos-kiosk.cachix.org-1:Ra804yD9XwVuzkKY3SnXbPz36sH5hHr27fz1qSBdmZ0= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Run checks
        run: |
          nix build \
            .#checks.x86_64-linux.app-networkmanager \
            .#checks.x86_64-linux.app-chromium \
            .#checks.x86_64-linux.app-daemon \
            .#checks.x86_64-linux.screenshot-setup-form

  images:
    name: SD Image (${{ matrix.config }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        config: [nixos-kiosk-rpi2, nixos-kiosk-rpi3]
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-substituters = https://nixos-kiosk.cachix.org https://ibizaman.cachix.org https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = ibizaman.cachix.org-1:Y8cRpAoeMfeeUp1jRG5KuwoVteZOQLG4HYkYyT4TC8k= nixos-kiosk.cachix.org-1:Ra804yD9XwVuzkKY3SnXbPz36sH5hHr27fz1qSBdmZ0= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Build SD image
        run: nix build .#sdImages.${{ matrix.config }} -o result

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config }}
          path: result/*.img.zst
          if-no-files-found: error
