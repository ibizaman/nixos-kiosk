name: Screenshot

on:
  push:
  pull_request:

jobs:
  check-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nixos-kiosk.cachix.org https://ibizaman.cachix.org https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = ibizaman.cachix.org-1:Y8cRpAoeMfeeUp1jRG5KuwoVteZOQLG4HYkYyT4TC8k= nixos-kiosk.cachix.org-1:Ra804yD9XwVuzkKY3SnXbPz36sH5hHr27fz1qSBdmZ0= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

      - name: Build screenshot
        run: nix build .#packages.x86_64-linux.screenshot-setup-form -o result-screenshot

      - name: Check screenshot is up to date
        run: |
          if ! diff -q result-screenshot/setup-form.png screenshots/setup-form.png; then
            echo ""
            echo "screenshots/setup-form.png is out of date."
            echo "Run the following to update it:"
            echo ""
            echo "  nix build .#packages.x86_64-linux.screenshot-setup-form -o result-screenshot"
            echo "  cp result-screenshot/setup-form.png screenshots/setup-form.png"
            echo ""
            exit 1
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-form
          path: result-screenshot
