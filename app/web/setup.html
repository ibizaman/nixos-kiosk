<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kiosk Setup</title>

<style>
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --background: #f5f7fb;
    --card: #ffffff;
    --border: #dbe3ee;
    --text: #1f2937;
    --muted: #6b7280;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    background: var(--background);
    color: var(--text);

    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.container {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border-radius: 16px;
    padding: 2rem;
    box-shadow:
        0 8px 24px rgba(0,0,0,0.08),
        0 2px 6px rgba(0,0,0,0.04);
}

h1 {
    margin-top: 0;
    margin-bottom: 0.75rem;
    font-size: 1.8rem;
    text-align: center;
}

p.description {
    margin-bottom: 2rem;
    color: var(--muted);
    line-height: 1.5;
    text-align: center;
}

form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.45rem;
}

input {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color .2s, box-shadow .2s;
}

input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

button {
    margin-top: 0.5rem;
    padding: 0.95rem;
    font-size: 1rem;
    font-weight: 600;
    color: white;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s;
}

button:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
    opacity: 0.75;
}

button:hover {
    background: var(--primary-hover);
}

button:disabled:hover {
    background: #cbd5e1;
}

button:active {
    transform: translateY(1px);
}

button:disabled:active {
    transform: none;
}

.status {
    padding: 1rem 1.25rem;
    border-radius: 10px;
    margin: 1rem 0;
    font-size: 1rem;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.status.info {
    background: #eef6ff;
    color: #0b5ed7;
    border: 1px solid #bfdbfe;
}

.status.success {
    background: #ecfdf5;
    color: #166534;
    border: 1px solid #bbf7d0;
}

.status.success::before {
    content: "✓";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    background: #22c55e;
    color: white;
    font-weight: bold;
    flex-shrink: 0;
}

.status.error {
    background: #fdecec;
    color: #b3261e;
    border: 1px solid #f3b3b3;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Connect This Device to WiFi</h1>

<p class="description">
  Enter the name and password of your WiFi network to connect this device.
</p>

<form id="wifi-form" action="/setup" method="post">

  <p>
    <label for="ssid">WiFi Name</label>
    <input id="ssid" name="ssid" autocomplete="off" required>
  </p>

  <div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" required title="Password must be 8 characters minimum">
  </div>

  <button type="submit">Connect</button>

  <div id="status" class="status hidden"></div>

</form>

</div>

</body>

<script>
const form = document.getElementById("wifi-form");
const status = document.getElementById("status");
const button = form.querySelector("button[type=submit]");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    status.className = "status info";
    status.textContent = "Connecting...";
    button.disabled = true;

    try {
        let resp = await fetch(form.action, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams(new FormData(form)),
        });

        let result = await resp.json();

        if (!resp.ok || result.status !== "ok") {
            throw new Error(result.error || "Connection failed.");
        }

        const path = result.path;

        for (let i = 0; i < 45; i++) {
            await new Promise(r => setTimeout(r, 1000));

            resp = await fetch(`/status?path=${encodeURIComponent(path)}`);
            result = await resp.json();

            console.log(result);

            if (!resp.ok || result.status !== "ok") {
                throw new Error(result.error || "Connection failed.");
            }

            switch (result.state) {
                case "activating":
                    status.className = "status info";
                    status.textContent = status.textContent + ".";
                    break;

                case "activated":
                    status.className = "status success";
                    status.textContent = "Connected!";
                    return;

                default:
                    throw new Error("Failed to connect.");
            }
        }

        throw new Error("Connection timed out.");
    } catch (err) {
        status.className = "status error";
        status.textContent = err.message;
    } finally {
        button.disabled = false;
    }
});
</script>

</html>
